name: Update Kelee Surge modules

on:
  schedule:
    # GitHub Actions cron uses UTC. This runs at 00:00 Asia/Shanghai.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kelee-modules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Verify jq
        run: jq --version

      - name: Fetch, convert, and validate modules
        run: python scripts/update_kelee_modules.py

      - name: Run converter tests
        run: python -m unittest discover -s tests

      - name: Commit changes
        run: |
          git add -A -- Loon Surge

          if [ -z "$(git status --porcelain)" ]; then
            echo "No module changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "chore: update Kelee Surge modules"
          git push
